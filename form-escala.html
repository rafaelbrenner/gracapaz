<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Escala de Culto — Graça e Paz</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f0f4f8;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:#fff;border-radius:12px;padding:32px;width:100%;max-width:480px;box-shadow:0 4px 24px rgba(0,0,0,.08)}
.header{text-align:center;margin-bottom:28px}
.header h1{font-size:1.4rem;color:#1a202c}
.header p{color:#718096;margin-top:6px;font-size:.9rem}
.field{margin-bottom:18px;position:relative}
label{display:block;font-size:.85rem;font-weight:600;color:#4a5568;margin-bottom:6px}
.req{color:#e53e3e}
input,select{width:100%;padding:10px 14px;border:1.5px solid #e2e8f0;border-radius:8px;font-size:.95rem;color:#2d3748;outline:none;transition:border-color .2s}
input:focus,select:focus{border-color:#4299e1}
.pw-wrap{position:relative}
.pw-wrap input{padding-right:42px}
.pw-toggle{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:#718096;padding:0;margin:0;width:auto;font-size:1.1rem;line-height:1}
.pw-toggle:hover{color:#2b6cb0}
.acl{position:absolute;top:100%;left:0;right:0;background:#fff;border:1.5px solid #e2e8f0;border-top:none;border-radius:0 0 8px 8px;max-height:200px;overflow-y:auto;z-index:100;box-shadow:0 4px 12px rgba(0,0,0,.1);display:none}
.aci{padding:10px 14px;cursor:pointer;font-size:.9rem;color:#2d3748}
.aci:hover{background:#ebf8ff;color:#2b6cb0}
button{width:100%;padding:12px;background:#2b6cb0;color:#fff;border:none;border-radius:8px;font-size:1rem;font-weight:600;cursor:pointer;margin-top:8px}
button:hover{background:#2c5282}
button:disabled{background:#a0aec0;cursor:not-allowed}
.ok{display:none;text-align:center;padding:24px}
.ok .ic{font-size:3rem}
.ok p{color:#2d3748;margin-top:12px}
.err{color:#e53e3e;font-size:.85rem;margin-top:8px;display:none;text-align:center}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid #e2e8f0}
.topbar span{font-size:.85rem;color:#4a5568}
.topbar strong{color:#2b6cb0}
.btn-sair{width:auto;padding:6px 16px;font-size:.8rem;background:#e53e3e;margin-top:0}
.btn-sair:hover{background:#c53030}
.btn-novo{width:auto;padding:10px 20px;margin-top:16px}
</style>
</head>
<body>

<!-- Tela de Login -->
<div class="card" id="login-card">
  <div class="header">
    <h1>⛪ Graça e Paz</h1>
    <p>Acesso restrito — Líderes e Secretaria</p>
  </div>
  <form id="login-form" autocomplete="off">
    <div class="field">
      <label>Usuário</label>
      <input type="text" id="l-usuario" placeholder="Seu usuário" required>
    </div>
    <div class="field">
      <label>Senha</label>
      <div class="pw-wrap">
        <input type="password" id="l-senha" placeholder="Sua senha" required>
        <button type="button" class="pw-toggle" id="pw-toggle" aria-label="Mostrar/ocultar senha">&#128065;</button>
      </div>
    </div>
    <p class="err" id="login-err">Usuário ou senha incorretos.</p>
    <button type="submit" id="login-btn">Entrar</button>
  </form>
</div>

<!-- Formulário de Escala -->
<div class="card" id="form-card" style="display:none">
  <div class="topbar">
    <span>Olá, <strong id="user-nome"></strong></span>
    <button class="btn-sair" id="btn-sair">Sair</button>
  </div>
  <div class="header">
    <h1>⛪ Escala de Culto</h1>
    <p>Igreja Batista Graça e Paz</p>
  </div>
  <form id="f" autocomplete="off">
    <div class="field">
      <label>Nome do Membro <span class="req">*</span></label>
      <input type="text" id="ni" placeholder="Digite o nome para buscar..." required>
      <input type="hidden" id="nv">
      <div class="acl" id="acl"></div>
    </div>
    <div class="field">
      <label>Função <span class="req">*</span></label>
      <select id="fn" required>
        <option value="">Selecione...</option>
        <option>Louvor</option>
        <option>Recepção</option>
        <option>Pregação</option>
        <option>Som</option>
        <option>Mídia / Projeção</option>
        <option>Intercessão</option>
        <option>Kids / Infantil</option>
        <option>Coordenação</option>
        <option>Outro</option>
      </select>
    </div>
    <div class="field">
      <label>Evento <span class="req">*</span></label>
      <input type="text" id="ev" placeholder="Ex: Culto Domingo, Reunião de Oração" required>
    </div>
    <div class="field">
      <label>Data <span class="req">*</span></label>
      <input type="date" id="dt" required>
    </div>
    <div class="field">
      <label>Horário <span class="req">*</span></label>
      <input type="time" id="hr" required>
    </div>
    <div class="field">
      <label>Registrado por</label>
      <input type="text" id="rg" readonly style="background:#f7fafc;color:#718096">
    </div>
    <button type="submit" id="btn">Registrar Escala</button>
  </form>
  <div class="ok" id="ok">
    <div class="ic">✅</div>
    <p><strong>Escala registrada!</strong><br>O membro receberá notificação pelo WhatsApp em breve.</p>
    <button class="btn-novo" id="btn-novo">Registrar outro</button>
  </div>
</div>

<script>
const API = 'https://n8n.gracaepazdf.org.br/webhook';
const SESSION_KEY = 'gp_secretario';

// --- Sessão ---
function getSession() {
  try { return JSON.parse(sessionStorage.getItem(SESSION_KEY)); } catch { return null; }
}

function iniciarSessao(dados) {
  sessionStorage.setItem(SESSION_KEY, JSON.stringify(dados));
  mostrarFormulario(dados);
}

function encerrarSessao() {
  sessionStorage.removeItem(SESSION_KEY);
  location.reload();
}

function mostrarFormulario(dados) {
  document.getElementById('login-card').style.display = 'none';
  document.getElementById('form-card').style.display = 'block';
  document.getElementById('user-nome').textContent = dados.nome;
  document.getElementById('rg').value = dados.nome;
}

// Verificar sessão ao carregar
const sessao = getSession();
if (sessao) mostrarFormulario(sessao);

// --- Login ---
document.getElementById('login-form').addEventListener('submit', async function(e) {
  e.preventDefault();
  const btn = document.getElementById('login-btn');
  const err = document.getElementById('login-err');
  err.style.display = 'none';
  btn.disabled = true;
  btn.textContent = 'Entrando...';

  try {
    const res = await fetch(API + '/auth-escala', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        usuario: document.getElementById('l-usuario').value.trim(),
        senha: document.getElementById('l-senha').value
      })
    });
    const data = await res.json();
    if (data.ok) {
      iniciarSessao({ nome: data.nome, usuario: data.usuario, departamento: data.departamento });
    } else {
      err.style.display = 'block';
    }
  } catch {
    err.textContent = 'Erro de conexão. Tente novamente.';
    err.style.display = 'block';
  }

  btn.disabled = false;
  btn.textContent = 'Entrar';
});

// --- Toggle senha ---
document.getElementById('pw-toggle').addEventListener('click', function() {
  const input = document.getElementById('l-senha');
  const show = input.type === 'password';
  input.type = show ? 'text' : 'password';
  this.innerHTML = show ? '&#128064;' : '&#128065;';
});

// --- Logout ---
document.getElementById('btn-sair').addEventListener('click', encerrarSessao);

// --- Registrar outro ---
document.getElementById('btn-novo').addEventListener('click', function() {
  document.getElementById('f').reset();
  document.getElementById('rg').value = getSession()?.nome || '';
  document.getElementById('f').style.display = 'block';
  document.getElementById('ok').style.display = 'none';
  document.getElementById('btn').disabled = false;
  document.getElementById('btn').textContent = 'Registrar Escala';
});

// --- Autocomplete ---
let sel = null, tmr;
const ni = document.getElementById('ni');
const nv = document.getElementById('nv');
const acl = document.getElementById('acl');

ni.addEventListener('input', function() {
  clearTimeout(tmr);
  sel = null;
  nv.value = '';
  const q = this.value.trim();
  if (q.length < 2) { acl.style.display = 'none'; return; }
  tmr = setTimeout(() => buscar(q), 300);
});

async function buscar(q) {
  try {
    const r = await fetch(API + '/buscar-membro?q=' + encodeURIComponent(q));
    const d = await r.json();
    renderList(d);
  } catch { acl.style.display = 'none'; }
}

function renderList(items) {
  if (!items || !items.length) { acl.style.display = 'none'; return; }
  acl.innerHTML = items.map(m =>
    '<div class="aci" data-nome="' + m.nome + '" data-cel="' + (m.celular_whatsapp || '') + '">' + m.nome + '</div>'
  ).join('');
  acl.style.display = 'block';
  acl.querySelectorAll('.aci').forEach(i => i.addEventListener('click', function() {
    sel = { nome: this.dataset.nome, cel: this.dataset.cel };
    ni.value = this.dataset.nome;
    nv.value = this.dataset.nome;
    acl.style.display = 'none';
  }));
}

document.addEventListener('click', e => {
  if (!e.target.closest('.field')) acl.style.display = 'none';
});

// --- Submit escala ---
document.getElementById('f').addEventListener('submit', async function(e) {
  e.preventDefault();
  if (!nv.value) { alert('Selecione um membro da lista.'); ni.focus(); return; }
  const btn = document.getElementById('btn');
  btn.disabled = true;
  btn.textContent = 'Registrando...';
  try {
    await fetch(API + '/form-escala-submit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        nome: nv.value,
        celular: sel?.cel || '',
        funcao: document.getElementById('fn').value,
        evento: document.getElementById('ev').value,
        data: document.getElementById('dt').value,
        hora: document.getElementById('hr').value,
        registrado_por: document.getElementById('rg').value
      })
    });
    document.getElementById('f').style.display = 'none';
    document.getElementById('ok').style.display = 'block';
  } catch {
    btn.disabled = false;
    btn.textContent = 'Registrar Escala';
    alert('Erro ao registrar. Tente novamente.');
  }
});
</script>
</body>
</html>
