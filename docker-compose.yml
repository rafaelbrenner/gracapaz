services:
  # Banco de dados PostgreSQL
  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-root}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-evolution}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - whatsapp-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-root}"]
      interval: 10s
      timeout: 5s
      retries: 5

# Evolution API (conexão com WhatsApp)
  # Build local aplica o patch LID — versão base fixada no patches/Dockerfile
  evolution-api:
    build: ./patches
    container_name: evolution-api
    ports:
      - "8080:8080"
    volumes:
      - evolution_instances:/evolution/instances
      - evolution_store:/evolution/store
    networks:
      - whatsapp-network
    environment:
      # Configurações básicas
      - SERVER_URL=${SERVER_URL:-http://localhost:8080}
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY}

      # Database
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://${POSTGRES_USER:-root}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-evolution}?schema=public
      - DATABASE_SAVE_DATA_INSTANCE=true
      - DATABASE_SAVE_DATA_NEW_MESSAGE=true
      - DATABASE_SAVE_MESSAGE_UPDATE=true
      
      # Webhooks (para N8N)
      - WEBHOOK_GLOBAL_URL=${N8N_WEBHOOK_URL:-http://localhost:5678}/webhook
      - WEBHOOK_GLOBAL_ENABLED=false
      - WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS=false
      
      # QR Code
      - QRCODE_LIMIT=30
      - QRCODE_COLOR=#000000
      
      # Outras configs
      - CONFIG_SESSION_PHONE_CLIENT=Evolution API
      - CONFIG_SESSION_PHONE_NAME=Chrome
      - CONFIG_SESSION_PHONE_VERSION=2.3000.1033846690
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  # N8N (automação) — v1 fixado para evitar breaking changes de versão major
  n8n:
    image: n8nio/n8n:1
    container_name: n8n
    ports:
      - "5678:5678"
    environment:
      - WEBHOOK_URL=${N8N_WEBHOOK_URL:-http://localhost:5678}
      - N8N_PROTOCOL=http
      - N8N_HOST=0.0.0.0
      - GENERIC_TIMEZONE=America/Sao_Paulo
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD}
      - N8N_SECURE_COOKIE=false   # mudar para true ao configurar HTTPS
      # PostgreSQL para N8N (workflows, execuções e credenciais no banco gerenciado)
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${N8N_DB:-n8n}
      - DB_POSTGRESDB_USER=${POSTGRES_USER:-root}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - whatsapp-network
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  # pgAdmin (interface web para gerenciar o PostgreSQL)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    ports:
      - "5050:80"
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_EMAIL:-admin@admin.com}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_PASSWORD}
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - whatsapp-network
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  # Formulário de escala (HTML estático via nginx)
  form-escala:
    image: nginx:alpine
    container_name: form-escala
    ports:
      - "3001:80"
    volumes:
      - ./form-escala.html:/usr/share/nginx/html/index.html:ro
    networks:
      - whatsapp-network
    restart: unless-stopped

  # Cloudflare Tunnel (opcional - descomente se for usar)
  # cloudflared:
  #   image: cloudflare/cloudflared:latest
  #   container_name: cloudflared
  #   command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
  #   networks:
  #     - whatsapp-network
  #   restart: unless-stopped
  #   depends_on:
  #     - evolution-api
  #     - n8n

networks:
  whatsapp-network:
    driver: bridge

volumes:
  postgres_data:
  evolution_instances:
  evolution_store:
  n8n_data:
  pgadmin_data:

    