services:
  # Banco de dados PostgreSQL
  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-root}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-evolution}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - whatsapp-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-root}"]
      interval: 10s
      timeout: 5s
      retries: 5

# N8N (automação) — v1 fixado para evitar breaking changes de versão major
  n8n:
    image: n8nio/n8n:1
    container_name: n8n
    ports:
      - "5678:5678"
    environment:
      - WEBHOOK_URL=${N8N_WEBHOOK_URL:-http://localhost:5678}
      - N8N_PROTOCOL=http
      - N8N_HOST=0.0.0.0
      - GENERIC_TIMEZONE=America/Sao_Paulo
      # WhatsApp Cloud API — expostos para uso via $env nas expressões dos nós HTTP
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - GRAPH_API_VERSION=${GRAPH_API_VERSION:-v21.0}
      - WHATSAPP_PHONE_NUMBER_ID=${WHATSAPP_PHONE_NUMBER_ID}
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD}
      - N8N_SECURE_COOKIE=true
      - N8N_TRUST_PROXY=true
      # PostgreSQL para N8N (workflows, execuções e credenciais no banco gerenciado)
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${N8N_DB:-n8n}
      - DB_POSTGRESDB_USER=${POSTGRES_USER:-root}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - whatsapp-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5678/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy

  # pgAdmin (interface web para gerenciar o PostgreSQL)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    ports:
      - "5050:80"
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_EMAIL:-admin@admin.com}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_PASSWORD}
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - whatsapp-network
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  # Formulário de escala (HTML estático via nginx)
  form-escala:
    image: nginx:alpine
    container_name: form-escala
    ports:
      - "3001:80"
    volumes:
      - ./form-escala.html:/usr/share/nginx/html/index.html:ro
    networks:
      - whatsapp-network
    restart: unless-stopped

  # Nginx Proxy Manager — reverse proxy com SSL automático (Let's Encrypt)
  # Admin UI: http://SEU_IP:81  (primeiro acesso: admin@example.com / changeme)
  nginx-proxy-manager:
    image: jc21/nginx-proxy-manager:latest
    container_name: nginx-proxy-manager
    ports:
      - "80:80"
      - "443:443"
      - "81:81"
    volumes:
      - npm_data:/data
      - npm_letsencrypt:/etc/letsencrypt
    networks:
      - whatsapp-network
    restart: unless-stopped

  # Cloudflare Tunnel (opcional - descomente se for usar)
  # cloudflared:
  #   image: cloudflare/cloudflared:latest
  #   container_name: cloudflared
  #   command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
  #   networks:
  #     - whatsapp-network
  #   restart: unless-stopped
  #   depends_on:
  #     - n8n

networks:
  whatsapp-network:
    driver: bridge

volumes:
  postgres_data:
  npm_data:
  npm_letsencrypt:
  n8n_data:
  pgadmin_data:

    